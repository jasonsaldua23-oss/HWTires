<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#f0f9f8"/>
  
  <!-- Tire/Wheel Design with Teal & Navy -->
  <!-- Outer ring - Teal -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#14b8a6" stroke-width="8"/>
  
  <!-- Inner design - Teal -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#14b8a6" stroke-width="4" opacity="0.6"/>
  
  <!-- Navy spokes -->
  <line x1="100" y1="25" x2="100" y2="175" stroke="#001f3f" stroke-width="3"/>
  <line x1="25" y1="100" x2="175" y2="100" stroke="#001f3f" stroke-width="3"/>
  <line x1="46" y1="46" x2="154" y2="154" stroke="#001f3f" stroke-width="3" opacity="0.7"/>
  <line x1="154" y1="46" x2="46" y2="154" stroke="#001f3f" stroke-width="3" opacity="0.7"/>
  
  <!-- Center circle -->
  <circle cx="100" cy="100" r="15" fill="#001f3f"/>
  
  <!-- Text -->
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#001f3f">HW TIRES</text>
</svg>
